<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>SpiceX</title>
        <link rel="stylesheet" href="./styles.css" />
        <script src="index.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Привет! &#x1F600;</h1>
        </header>

        <main class="main">
            <div class="card outline">
                <form novalidate>
                    <h2>Sign in</h2>

                    <button type="button"">Continue with Google</button>
                    <button type="button">Continue with Apple</button>

                    <p>or</p>

                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error">
                    <p class="error" id="email-error" aria-live="polite"></p>

                    <label for="password">Пароль</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="password-error">
                    <p class="error" id="password-error" aria-live="polite"></p>

                    <a href="#">Forgot password?</a>
                    
                    <div>
                        <input id="keep" name="keep" type="checkbox">
                        <label for="keep">Keep me logged in?</label>
                    </div>
                    
                    <p id="form-status" role="status"></p>
                    <button type="submit">Sign in</button>
                    <button type="reset">Reset</button>

                    <p>New to SpiceX? <a href="">Join now</a></p>
                </form>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 BulatAF</p>
            <div><a href="https://vk.ru/boolaton">ВКонтакте</a></div>
            <div><p>Почта: buardurdyev@hse.edu.ru</p></div>
        </footer>
    </body>
</html>
