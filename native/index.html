<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Форма авторизации</title>
        <link rel="stylesheet" href="./styles.css" />
        <script src="index.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Добро пожаловать в SpiceX!</h1>
        </header>

        <main class="main">
            <div class="card outline">
                <form>
                    <h2>Sign in</h2>

                    <button type="button" onclick="onMainClick()">Continue with Google</button>
                    <button type="button">Continue with Apple</button>

                    <p>or</p>

                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>

                    <label for="password">Пароль</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>

                    <a href="#">Forgot password?</a>
                    
                    <div>
                        <input id="keep" name="keep" type="checkbox">
                        <label for="keep">Keep me logged in?</label>
                    </div>
                    

                    <button type="submit">Sign in</button>
                    <button type="reset">Reset</button>

                    <p>New to LinkedIn? <a href="">Join now</a></p>
                </form>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 BulatAF</p>
            <div><a href="https://vk.ru/boolaton">ВКонтакте</a></div>
            <div><p>Почта: buardurdyev@hse.edu.ru</p></div>
        </footer>
    </body>
</html>
