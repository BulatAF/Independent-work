<!DOCTYPE html>
<html lang="ru">
    <head>
        <title>SpiceX</title>
        <link rel="stylesheet" href="./styles.css" />
        <script src="index.js" defer></script>
    </head>
    <body>
        
        <header>
            <h1><span class="pepper">🌶️</span>   Привет!   <span class="pepper">🌶️</span></h1> 
        </header>

        <main class = "main">
            <div class = "form">       
                <form novalidate>
                    <h2>Sign in</h2>

                    <div>
                          <button type="button">Continue with Google</button>
                    </div>
                    <div><button type="button">Continue with Apple</button></div>

                    <p id = "central_or">or</p>

                    <div>
                        <input id="email" name="email" type="email" placeholder="Email">
                    </div>
                    
                    <div>
                        <input id="password" name="password" type="password" placeholder="Password">
                    </div>
                    <a href="https://www.youtube.com/watch?v=BL8ZKeGCaIg">Forgot password?</a>
                    
                    <div>
                        <input id="keep" name="keep" type="checkbox">
                        <label for="keep" class = "keep">Keep me logged in?</label>
                    </div>
                    
                    <p id="form-status" role="status"></p>
                    <button type="submit">Sign in</button>
                </form>
                
            </div>

            
        </main>

        <footer>
            <p>New to SpiceX? <a href="">Join now</a></p>
            <p>&copy; 2026 BulatAF</p>
            <div><a href="https://vk.ru/boolaton">ВКонтакте</a></div>
            <div><p>Почта: buardurdyev@hse.edu.ru</p></div>
        </footer>
        <div id="gif-effect">
        <img src="assets/animations/elon-musk.gif" alt="Анимация">
        <audio id="sound" src="assets/sounds/snoopDog.mp3"></audio>
        </div>
    </body>
</html>
